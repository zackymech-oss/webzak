name: Auto Build & Deploy to IPFS

on:
  push:
    paths:
      - 'home/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate js/files.js
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const homeDir = "./home";
          const fileSystem = {};
          const fileData = {};

          if (fs.existsSync(homeDir)) {
            const dirs = fs.readdirSync(homeDir, { withFileTypes: true });
            dirs.forEach(dirent => {
              if (dirent.isDirectory()) {
                const dirName = dirent.name;
                const dirPath = path.join(homeDir, dirName);
                const files = fs.readdirSync(dirPath);
                fileSystem[dirName] = files;

                files.forEach(file => {
                  const filePath = path.join(dirPath, file);
                  const ext = path.extname(file).toLowerCase();
                  if (ext === ".url" || ext === ".txt") {
                    try {
                      const content = fs.readFileSync(filePath, "utf-8");
                      const lines = content.split(/\r?\n/);
                      lines.forEach(line => {
                        if (line.startsWith("URL=")) {
                          fileData[file] = line.substring(4).trim();
                        } else if (line.startsWith("http://") || line.startsWith("https://")) {
                          fileData[file] = line.trim();
                        }
                      });
                    } catch (e) {}
                  }
                });
              }
            });
          }

          const output = `const fileSystem = ${JSON.stringify(fileSystem, null, 4)};\n\nconst fileData = ${JSON.stringify(fileData, null, 4)};\n`;
          fs.writeFileSync("./js/files.js", output);
          '

      - name: Commit & Push Updated files.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/files.js
          git diff-index --quiet HEAD || git commit -m "auto: update index js/files.js [skip ci]"
          git push

      - name: Install Form-Data
        run: npm install form-data

      - name: Upload Directory to Pinata IPFS
        env:
          PINATA_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET: ${{ secrets.PINATA_SECRET_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const http = require("https");
          const FormData = require("form-data");

          async function uploadFolder() {
            const files = [];
            function walk(dir) {
              const list = fs.readdirSync(dir);
              list.forEach(file => {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                  if (!file.startsWith(".") && file !== "node_modules") walk(filePath);
                } else {
                  if (!file.startsWith(".")) files.push(filePath);
                }
              });
            }
            walk("./");

            const formData = new FormData();
            files.forEach(file => {
              const relativePath = file.replace(/^\.\//, "");
              formData.append("file", fs.createReadStream(file), {
                filepath: `webzak-build/${relativePath}`
              });
            });

            const metadata = JSON.stringify({ name: "webzak-build" });
            formData.append("pinataMetadata", metadata);

            const request = http.request({
              method: "POST",
              host: "api.pinata.cloud",
              path: "/pinning/pinFileToIPFS",
              headers: {
                ...formData.getHeaders(),
                pinata_api_key: process.env.PINATA_KEY,
                pinata_secret_api_key: process.env.PINATA_SECRET
              }
            }, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => {
                console.log("Pinata Response:", data);
              });
            });

            formData.pipe(request);
          }
          uploadFolder();
          '
