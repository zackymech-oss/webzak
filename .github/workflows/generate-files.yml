name: Auto Generate Files Index

on:
  push:
    paths:
      - 'home/**'

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate js/files.js
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const homeDir = "./home";
          const fileSystem = {};
          const fileData = {};

          if (fs.existsSync(homeDir)) {
            const dirs = fs.readdirSync(homeDir, { withFileTypes: true });
            dirs.forEach(dirent => {
              if (dirent.isDirectory()) {
                const dirName = dirent.name;
                const dirPath = path.join(homeDir, dirName);
                const files = fs.readdirSync(dirPath);
                fileSystem[dirName] = files;

                files.forEach(file => {
                  const filePath = path.join(dirPath, file);
                  const ext = path.extname(file).toLowerCase();
                  if (ext === ".url" || ext === ".txt") {
                    try {
                      const content = fs.readFileSync(filePath, "utf-8");
                      const lines = content.split(/\r?\n/);
                      lines.forEach(line => {
                        if (line.startsWith("URL=")) {
                          fileData[file] = line.substring(4).trim();
                        } else if (line.startsWith("http://") || line.startsWith("https://")) {
                          fileData[file] = line.trim();
                        }
                      });
                    } catch (e) {}
                  }
                });
              }
            });
          }

          const output = `const fileSystem = ${JSON.stringify(fileSystem, null, 4)};\n\nconst fileData = ${JSON.stringify(fileData, null, 4)};\n`;
          fs.writeFileSync("./js/files.js", output);
          '

      - name: Commit & Push Updated files.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/files.js
          git diff-index --quiet HEAD || git commit -m "auto: update index js/files.js [skip ci]"
          git push
