<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Identity -->
    <title>Bang Zaki | System Node & Infrastructure Directory</title>
    <meta name="description" content="Public directory and system node for Bang Zaki. Managed terminal environment for technical projects, documentation, and infrastructure shortcuts.">
    <meta name="author" content="Bang Zaki">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (Sosmed & Gateway Preview) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bang Zaki | System Node & Infrastructure Directory">
    <meta property="og:description" content="Public directory and system node for Bang Zaki. Managed terminal environment for technical projects and documentation.">
    <meta property="og:url" content="https://omzaki.com">
    <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/console.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- OVERLAY GAME DINO FULL PAGE -->
    <div id="dino-overlay">
        <div class="dino-container">
            <h2>SECURITY VERIFICATION</h2>
            <p class="dino-instructions">Lompati <b>10 kaktus</b> untuk membuka akses!</p>
            <div id="dino-score">Jumps: <span id="jump-count">0</span> / 10</div>
            <canvas id="dinoCanvas" width="600" height="150"></canvas>
            <p class="dino-hint">[ Tekan <b>SPASI</b> atau <b>TAP SCREEN</b> untuk Lompat ]</p>
        </div>
    </div>

    <!-- WINDOW TERMINAL -->
    <div class="terminal-window">
        <!-- Header Bar Terminal -->
        <div class="terminal-header">
            <div class="buttons">
                <span class="btn close"></span>
                <span class="btn minimize"></span>
                <span class="btn maximize"></span>
            </div>
            <div class="title">guest@omzaki.com:~ (ssh)</div>
        </div>

        <!-- Body Terminal -->
        <div class="terminal-body" id="terminal-body">
            <div id="output"></div>
            <div class="input-line">
                <span id="prompt" class="prompt">guest@server:~$ </span>
                <div class="input-wrapper">
                    <input type="text" id="cli-input" autofocus autocomplete="off" spellcheck="false">
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Bar -->
        <div class="mobile-bar">
            <button onclick="sendQuickCmd('TAB')">TAB</button>
            <button onclick="sendQuickCmd('UP')">▲</button>
            <button onclick="sendQuickCmd('DOWN')">▼</button>
            <button onclick="sendQuickCmd('CLEAR')">CLEAR</button>
            <button onclick="sendQuickCmd('LS')">LS</button>
        </div>
    </div>

<!-- JavaScript Scripts -->
    <script src="js/files.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dino.js"></script>

<!-- Auto-Login & Bypass Session Script (Per Sesi) -->
    <script>
        (function() {
            // Cek parameter ?dev=true di URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('dev') === 'true') {
                sessionStorage.setItem('auth_session', 'true');
            }

            // Kalo session sesi ini la ada, sembunyikan dino
            if (sessionStorage.getItem('auth_session') === 'true') {
                const style = document.createElement('style');
                style.innerHTML = '#dino-overlay { display: none !important; }';
                document.head.appendChild(style);
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('auth_session') === 'true') {
                const overlay = document.getElementById('dino-overlay');
                if (overlay) overlay.style.display = 'none';

                if (typeof currentUser !== 'undefined') {
                    currentUser = "guest";
                    if (typeof updatePrompt === 'function') updatePrompt();
                }

                const cliInput = document.getElementById('cli-input');
                if (cliInput) cliInput.focus();
            }
        });
    </script>
</body>
</html>
