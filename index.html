<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>BANG ZAKI // System Administrator & IT Portfolio</title>
    <meta name="description" content="Interactive terminal portfolio of Bang Zaki, a System Administrator and IT Support specialist managing high-performance digital infrastructure and servers.">
    <meta name="keywords" content="Bang Zaki, System Administrator, IT Support, Linux, Web Development, Portfolio, Terminal Portfolio">
    <meta name="author" content="Bang Zaki">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="BANG ZAKI // System Terminal & Portfolio">
    <meta property="og:description" content="Interactive Linux-style terminal portfolio showcasing sysadmin skills, server management, and media vaults.">
    <meta property="og:url" content="https://bangzaki.hub">
    
    <!-- Robots / Indexing -->
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dino-overlay" class="dino-overlay">
        <div class="dino-modal">
            <div class="dino-header">
                <span>SECURITY CHALLENGE // SYSTEM LOCK ACTIVE</span>
                <span class="dino-target-info">Target: <span id="jump-count">0</span>/10 Jumps</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="dinoCanvas" width="480" height="150"></canvas>
            </div>
            <div class="dino-footer">
                Press <span class="key-badge">SPACE</span> or <span class="key-badge">TAP</span> to jump over incoming blocks. Reach 10 jumps to unlock terminal.
            </div>
        </div>
    </div>

    <div class="crt-overlay"></div>
    
    <div class="terminal-container">
        <!-- Mac Window Header Bar -->
        <div class="window-header">
            <div class="window-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="window-title">guest@bangzaki.hub:~ (ssh)</div>
        </div>

        <div id="output"></div>
        <div class="input-line">
            <span class="prompt">guest@bangzaki.hub:~#</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- Modular Content Files -->
    <script src="bio.js"></script>
    <script src="skills.js"></script>
    <script src="experience.js"></script>
    <script src="project.js"></script>
    <script src="contact.js"></script>
    <script src="media.js"></script>
    
    <!-- Game & Terminal Engine -->
    <script src="dino.js"></script>
    <script src="terminal.js"></script>
</body>
</html>
